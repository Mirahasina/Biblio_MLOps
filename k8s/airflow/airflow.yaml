apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: librairy
data:
  etl_filter_dag.py: |
    """DAG ETL Librairy : extract -> filter -> load"""
    from datetime import datetime, timedelta
    import os
    from airflow import DAG
    from airflow.operators.python import PythonOperator

    default_args = {
        "owner": "devsecops",
        "depends_on_past": False,
        "retries": 1,
        "retry_delay": timedelta(minutes=2),
    }
    DATABASE_URL = os.getenv(
        "DATABASE_URL",
        "postgresql://library:library@postgres:5432/library",
    )

    def _connect():
        import psycopg2
        return psycopg2.connect(DATABASE_URL)

    def extract_books(**context):
        conn = _connect()
        cur = conn.cursor()
        cur.execute("SELECT id, title, author, isbn, genre, price, available FROM books")
        records = cur.fetchall()
        cur.close(); conn.close()
        context["ti"].xcom_push(key="raw_books", value=[list(r) for r in records])
        print(f"Extracted {len(records)} books")
        return len(records)

    def filter_books(**context):
        records = context["ti"].xcom_pull(key="raw_books", task_ids="extract")
        filtered = [r for r in records if r[6] is True and float(r[5]) > 0]
        context["ti"].xcom_push(key="filtered_books", value=filtered)
        print(f"Filtered {len(filtered)} books")
        return len(filtered)

    def load_filtered(**context):
        filtered = context["ti"].xcom_pull(key="filtered_books", task_ids="filter")
        conn = _connect(); cur = conn.cursor()
        cur.execute("""
            CREATE TABLE IF NOT EXISTS books_report (
              id INTEGER PRIMARY KEY, title VARCHAR(255), author VARCHAR(255),
              isbn VARCHAR(20), genre VARCHAR(100), price FLOAT, available BOOLEAN,
              processed_at TIMESTAMP DEFAULT NOW())
        """)
        for book in filtered:
            cur.execute("""
              INSERT INTO books_report (id, title, author, isbn, genre, price, available)
              VALUES (%s,%s,%s,%s,%s,%s,%s)
              ON CONFLICT (id) DO UPDATE SET price=EXCLUDED.price,
                available=EXCLUDED.available, processed_at=NOW()
            """, book)
        conn.commit(); cur.close(); conn.close()
        print(f"Loaded {len(filtered)} books into books_report")

    with DAG(
        dag_id="librairy_etl_filter",
        default_args=default_args,
        description="ETL livres extract-filter-load",
        schedule_interval="@daily",
        start_date=datetime(2026, 1, 1),
        catchup=False,
        tags=["librairy", "etl"],
    ) as dag:
        extract = PythonOperator(task_id="extract", python_callable=extract_books)
        filter_task = PythonOperator(task_id="filter", python_callable=filter_books)
        load = PythonOperator(task_id="load", python_callable=load_filtered)
        extract >> filter_task >> load
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
  namespace: librairy
  labels:
    app: airflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airflow
  template:
    metadata:
      labels:
        app: airflow
    spec:
      containers:
        - name: airflow
          image: apache/airflow:2.9.3-python3.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: SequentialExecutor
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "False"
            - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
              value: "True"
            - name: AIRFLOW__WEBSERVER__BASE_URL
              value: "https://www.librairy.lcl/airflow"
            - name: AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX
              value: "True"
            - name: _AIRFLOW_WWW_USER_USERNAME
              value: admin
            - name: _AIRFLOW_WWW_USER_PASSWORD
              value: admin
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://library:library@postgres:5432/library
            - name: DATABASE_URL
              value: postgresql://library:library@postgres:5432/library
            - name: AIRFLOW__CORE__FERNET_KEY
              value: "YlCPjdlydMy3hs9U4nCBy7sq9_Uc5m6uYs3eXxWn9y0="
          command:
            - bash
            - -c
            - |
              mkdir -p /opt/airflow/dags
              cp -L /config/dags/*.py /opt/airflow/dags/ 2>/dev/null || true
              pip install --no-cache-dir psycopg2-binary==2.9.9 -q
              airflow db migrate
              airflow users create \
                --username admin \
                --password admin \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@librairy.lcl || \
              airflow users reset-password \
                --username admin \
                --password admin
              exec airflow standalone
          volumeMounts:
            - name: dags-cm
              mountPath: /config/dags
              readOnly: true
            - name: dags-runtime
              mountPath: /opt/airflow/dags
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /airflow/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: dags-cm
          configMap:
            name: airflow-dags
        - name: dags-runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
  namespace: librairy
spec:
  selector:
    app: airflow
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
  publishNotReadyAddresses: true
