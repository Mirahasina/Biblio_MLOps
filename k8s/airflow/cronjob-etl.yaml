apiVersion: batch/v1
kind: CronJob
metadata:
  name: etl-filter-books
  namespace: librairy
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: etl-runner
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              env:
                - name: PGPASSWORD
                  value: library
              command:
                - /bin/sh
                - -c
                - |
                  psql -h postgres -U library -d library -c "
                    CREATE TABLE IF NOT EXISTS books_report (
                      id INTEGER PRIMARY KEY,
                      title VARCHAR(255),
                      author VARCHAR(255),
                      isbn VARCHAR(20),
                      genre VARCHAR(100),
                      price FLOAT,
                      available BOOLEAN,
                      processed_at TIMESTAMP DEFAULT NOW()
                    );
                    INSERT INTO books_report (id, title, author, isbn, genre, price, available)
                    SELECT id, title, author, isbn, genre, price, available
                    FROM books WHERE available = true AND price > 0
                    ON CONFLICT (id) DO UPDATE SET
                      price = EXCLUDED.price,
                      available = EXCLUDED.available,
                      processed_at = NOW();
                  "
          restartPolicy: OnFailure
