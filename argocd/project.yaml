apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: librairy
  namespace: argocd
spec:
  description: Librairy DevSecOps Project
  sourceRepos:
    - "*"
  destinations:
    - namespace: librairy
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
